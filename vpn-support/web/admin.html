<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оператор — тикеты VPN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #10222b; color: #e8eef2; height: 100vh; display: flex; }
    #sidebar { width: 320px; background: #152c36; border-right: 1px solid #23404d; display: flex; flex-direction: column; }
    #sidebar header { padding: 14px; border-bottom: 1px solid #23404d; }
    #sidebar h1 { font-size: 16px; }
    .filters { display: flex; gap: 6px; padding: 10px 14px; flex-wrap: wrap; }
    .filters button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 20px; background: #1d3a47; font-size: 12px; }
    .filters button.active { background: #3390ec; color: #fff; }
    #ticketList { overflow-y: auto; flex: 1; }
    .t-item { padding: 12px 14px; border-bottom: 1px solid #1d3a47; cursor: pointer; }
    .t-item:hover, .t-item.sel { background: #1d3a47; }
    .t-item .row1 { display: flex; justify-content: space-between; font-size: 13px; }
    .t-item .tid { font-weight: 700; color: #6ab7ff; }
    .t-item .topic { font-size: 13px; margin-top: 4px; }
    .t-item .who { font-size: 12px; opacity: .6; margin-top: 2px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .open { background: #b3403f33; color: #ff8a85; }
    .answered { background: #b3953f33; color: #ffd479; }
    .in_progress { background: #3f6bb333; color: #79b0ff; }
    .closed { background: #3fb36b33; color: #79ffb0; }
    .canceled { background: #88888833; color: #bbb; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #chatHead { padding: 14px 18px; border-bottom: 1px solid #23404d; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    #chatHead .actions button { all: unset; cursor: pointer; margin-left: 8px; padding: 6px 12px; border-radius: 8px; background: #1d3a47; font-size: 12px; }
    #msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-start; background: #1d3a47; }
    .msg.admin { align-self: flex-end; background: #2b5f8a; }
    .msg.system { align-self: center; background: transparent; opacity: .5; font-size: 12px; }
    .msg .from { font-size: 11px; opacity: .6; margin-bottom: 3px; }
    #composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #23404d; }
    #composer input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #23404d; background: #152c36; color: inherit; font-size: 14px; }
    #composer button { padding: 12px 22px; border: none; border-radius: 10px; background: #3390ec; color: #fff; font-weight: 600; cursor: pointer; }
    #empty { margin: auto; opacity: .4; text-align: center; }
    #login { position: fixed; inset: 0; background: #10222b; display: flex; align-items: center; justify-content: center; z-index: 10; }
    #login div { text-align: center; }
    #login input { padding: 12px; border-radius: 10px; border: 1px solid #23404d; background: #152c36; color: #fff; }
    #login button { padding: 12px 20px; border: none; border-radius: 10px; background: #3390ec; color: #fff; margin-left: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login"><div>
    <h2 style="margin-bottom:14px">🔐 Панель оператора</h2>
    <input id="pw" type="password" placeholder="Пароль доступа" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Войти</button>
  </div></div>

  <div id="sidebar">
    <header><h1>🎫 Тикеты поддержки</h1></header>
    <div class="filters" id="filters">
      <button data-f="" class="active">Все</button>
      <button data-f="open">🔴 Новые</button>
      <button data-f="in_progress">🔵 В работе</button>
      <button data-f="answered">🟡 Ожидают клиента</button>
      <button data-f="closed">✅ Решённые</button>
    </div>
    <div id="ticketList"></div>
  </div>

  <div id="main">
    <div id="chatHead"><span id="headInfo">Выберите тикет</span>
      <span class="actions" id="actions" style="display:none">
        <button onclick="setStatus('in_progress')">🔵 В работу</button>
        <button onclick="setStatus('closed')">✅ Решён</button>
      </span>
    </div>
    <div id="msgs"><div id="empty">← Выберите тикет слева</div></div>
    <div id="composer" style="display:none">
      <input id="reply" placeholder="Ответ клиенту…" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">➤</button>
    </div>
  </div>

<script>
let TOKEN = '', cur = null, lastMsgId = 0, filter = '';
const STATUS = { open:'🔴 Открыт', answered:'🟡 Ждём клиента', in_progress:'🔵 В работе', closed:'✅ Решён', canceled:'⚪ Отменён' };

// Пароль = APP_SECRET из .env (простая защита панели; в проде поставьте за nginx + https)
async function login() {
  TOKEN = document.getElementById('pw').value;
  const r = await fetch('/api/tickets?token=' + encodeURIComponent(TOKEN));
  if (!r.ok) { alert('Неверный пароль'); return; }
  document.getElementById('login').remove();
  loadTickets(); setInterval(loadTickets, 8000);
  if (cur) poll();
}

async function api(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + sep + 'token=' + encodeURIComponent(TOKEN), opts);
  if (r.status === 401 || r.status === 403) { alert('Сессия истекла'); location.reload(); throw 0; }
  return r.json();
}

async function loadTickets() {
  const list = await api('/api/tickets' + (filter ? '?status=' + filter : ''));
  const el = document.getElementById('ticketList');
  el.innerHTML = list.map(t => `
    <div class="t-item ${cur && cur.id===t.id?'sel':''}" onclick="openTicket('${t.id}')">
      <div class="row1"><span class="tid">${t.id}</span><span class="badge ${t.status}">${STATUS[t.status]||t.status}</span></div>
      <div class="topic">${esc(t.topic)}</div>
      <div class="who">${esc(t.full_name)} · ${new Date(t.updated_at*1000).toLocaleString()}</div>
    </div>`).join('') || '<div style="padding:20px;opacity:.5">пусто</div>';
}

async function openTicket(id) {
  cur = (await api('/api/tickets')).find(t => t.id === id);
  lastMsgId = 0;
  document.getElementById('msgs').innerHTML = '';
  document.getElementById('composer').style.display = 'flex';
  document.getElementById('actions').style.display = 'inline';
  document.getElementById('headInfo').textContent = `${id} · ${cur.topic} · ${cur.full_name}`;
  loadTickets(); poll();
}

async function poll() {
  if (!cur) return;
  const msgs = await api(`/api/ticket/${cur.id}/messages?after=${lastMsgId}`);
  if (msgs.length) {
    const box = document.getElementById('msgs');
    for (const m of msgs) {
      lastMsgId = Math.max(lastMsgId, m.id);
      const d = document.createElement('div');
      d.className = 'msg ' + m.sender_type;
      d.innerHTML = (m.sender_type !== 'system' ? `<div class="from">${esc(m.sender_name)}</div>` : '') + esc(m.text);
      box.appendChild(d);
    }
    box.scrollTop = box.scrollHeight;
  }
  setTimeout(poll, 2500);
}

async function send() {
  const inp = document.getElementById('reply');
  const text = inp.value.trim();
  if (!text || !cur) return;
  inp.value = '';
  await api('/api/admin/reply', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ ticket_id: cur.id, text }),
  });
}

async function setStatus(s) {
  if (!cur) return;
  await api('/api/admin/status', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ ticket_id: cur.id, status: s }),
  });
  loadTickets();
}

document.getElementById('filters').addEventListener('click', e => {
  if (e.target.dataset.f === undefined) return;
  filter = e.target.dataset.f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  loadTickets();
});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
